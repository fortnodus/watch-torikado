name: watch-torikado

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（UTC基準・GitHub側の混雑で数分遅れることあり）
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Slackにテスト通知だけ送る"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watch-torikado
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watch-torikado-state-${{ github.run_id }}
          restore-keys: |
            watch-torikado-state-

      - name: Check availability
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          SEATS: "2"          # 例: "2,3,4" で複数人数をまとめて監視
          MONTHS_AHEAD: "3"   # 今月を含めて何か月分見るか
        run: python3 watch.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watch-torikado-state-${{ github.run_id }}
